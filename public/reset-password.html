<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Passwort zurücksetzen</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #f4f7fb;
        color: #172033;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 24px;
        place-items: center;
      }

      main {
        width: min(100%, 420px);
        padding: 32px;
        background: #fff;
        border: 1px solid #dbe3ef;
        border-radius: 12px;
        box-shadow: 0 18px 45px rgb(40 61 90 / 12%);
      }

      h1 {
        margin: 0 0 8px;
        font-size: 1.7rem;
      }

      p {
        margin: 0 0 24px;
        color: #58657a;
        line-height: 1.5;
      }

      label {
        display: block;
        margin: 16px 0 6px;
        font-size: 0.9rem;
        font-weight: 600;
      }

      input {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid #b9c5d6;
        border-radius: 7px;
        font: inherit;
      }

      input:focus {
        border-color: #2563eb;
        outline: 3px solid rgb(37 99 235 / 18%);
      }

      button {
        width: 100%;
        margin-top: 24px;
        padding: 12px 16px;
        border: 0;
        border-radius: 7px;
        background: #2563eb;
        color: #fff;
        cursor: pointer;
        font: inherit;
        font-weight: 700;
      }

      button:disabled {
        cursor: wait;
        opacity: 0.65;
      }

      #message {
        margin-top: 16px;
        padding: 10px 12px;
        border-radius: 7px;
        font-size: 0.92rem;
      }

      .error {
        background: #fff1f2;
        color: #be123c;
      }

      .success {
        background: #ecfdf5;
        color: #047857;
      }

      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Passwort zurücksetzen</h1>
      <p>Vergib ein neues Passwort für deinen Account.</p>

      <form id="reset-form">
        <label for="password">Neues Passwort</label>
        <input
          id="password"
          name="password"
          type="password"
          minlength="8"
          autocomplete="new-password"
          required
        />

        <label for="password-confirmation">Passwort wiederholen</label>
        <input
          id="password-confirmation"
          name="password-confirmation"
          type="password"
          minlength="8"
          autocomplete="new-password"
          required
        />

        <button id="submit-button" type="submit">Passwort speichern</button>
      </form>

      <div id="message" role="alert" hidden></div>
    </main>

    <script>
      const form = document.querySelector('#reset-form');
      const passwordInput = document.querySelector('#password');
      const confirmationInput = document.querySelector('#password-confirmation');
      const submitButton = document.querySelector('#submit-button');
      const message = document.querySelector('#message');
      const token = new URLSearchParams(window.location.search).get('token');

      function getCsrfToken() {
        const cookie = document.cookie.split('; ').find(value => value.startsWith('csrf_token='));
        return cookie ? decodeURIComponent(cookie.slice('csrf_token='.length)) : '';
      }

      function showMessage(text, type) {
        message.textContent = text;
        message.className = type;
        message.hidden = false;
      }

      if (!token) {
        form.hidden = true;
        showMessage('Der Link zum Zurücksetzen ist unvollständig.', 'error');
      }

      form.addEventListener('submit', async event => {
        event.preventDefault();
        message.hidden = true;

        if (passwordInput.value !== confirmationInput.value) {
          showMessage('Die Passwörter stimmen nicht überein.', 'error');
          return;
        }

        submitButton.disabled = true;

        try {
          const response = await fetch(`/api/auth/reset-password/${encodeURIComponent(token)}`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'X-CSRF-Token': getCsrfToken(),
            },
            body: JSON.stringify({ password: passwordInput.value }),
          });
          const data = await response.json().catch(() => ({}));

          if (!response.ok) {
            throw new Error(data.error || 'Das Passwort konnte nicht zurückgesetzt werden.');
          }

          form.reset();
          form.hidden = true;
          showMessage('Dein Passwort wurde erfolgreich geändert.', 'success');
        } catch (error) {
          showMessage(error.message || 'Das Passwort konnte nicht zurückgesetzt werden.', 'error');
        } finally {
          submitButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
