services:
  app:
    build:
      context: .
      args:
        APP_VERSION: ${IMAGE_TAG:-0.0.0}
    image: ${IMAGE_NAME:-genericfoalts}:${IMAGE_TAG:-0.0.0}
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3001}
      APP_FRONTEND_BASE_URL: ${APP_FRONTEND_BASE_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      SECURITY_HELMET_ENFORCE_HTTPS_IN_PRODUCTION: false
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      DATABASE_TYPE: postgres
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USERNAME: ${DATABASE_USERNAME:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}
      DATABASE_NAME: ${DATABASE_NAME:-genericfoalts}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DATABASE_SSL_REJECT_UNAUTHORIZED: ${DATABASE_SSL_REJECT_UNAUTHORIZED:-false}
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-docker}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-docker}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-noreply@example.com}
    ports:
      - '${APP_PORT:-3001}:3001'
    restart: unless-stopped
    volumes:
      - app-storage:/app/storage
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-genericfoalts}
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}
    healthcheck:
      test:
        - CMD-SHELL
        - 'PGPASSWORD=$${DATABASE_PASSWORD} pg_isready -h 127.0.0.1 -U ${DATABASE_USERNAME:-postgres} -d ${DATABASE_NAME:-genericfoalts}'
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - '127.0.0.1:${DATABASE_EXTERNAL_PORT:-5432}:5432'
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  app-storage:
  postgres-data:
